name: Nightfall Chess checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run project tests
        run: npm test
      - name: Check JavaScript syntax
        run: |
          find . -path ./node_modules -prune -o -type f \( -name "*.mjs" -o -name "*.js" \) -print0 | xargs -0 -n1 node --check
